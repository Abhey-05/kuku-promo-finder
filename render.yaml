# Render Blueprint: a free static site, built and served from the repo root.
# Tests gate the build, as they do for GitHub Pages. VITE_BASE stays unset, so assets load from /.
services:
  - type: web
    name: kuku-promo-finder
    runtime: static
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci --include=dev && npm test && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
